name: release

# 打 tag 即发版：tag 形如 v0.2.0，且必须与 VERSION 文件一致。
# 客户端「检查更新」读取的就是这里的 Release（tag = 版本号，body = 更新说明）。
#
# 更新说明优先取 `release-notes/<tag>.md`（由人写、进仓库留档），没有该文件才退回自动生成。
# **再次推送同一个 tag 是安全的**：Release 已存在时改为"更新说明 + 覆盖附件"，
# 这样修一版说明不必删 Release，也不会把工作流刷红。
#
# 手动重跑要**显式给 tag**：`gh workflow run release.yml -f tag=v0.2.0`。
# 不能像原来那样直接 workflow_dispatch——那时 `github.ref_name` 是分支名（main），
# 脚本会把 main 当版本号去比对 VERSION，必然对不上（这是个坑，已修）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发版/重跑的 tag（必须已存在，形如 v0.2.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # push 事件取 tag 名；手动触发取输入。两处都用它，别再直接读 GITHUB_REF_NAME。
      TAG_REF: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 校验 tag 与 VERSION 一致
        run: |
          TAG="${TAG_REF#v}"
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG  VERSION=$VER"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            echo "::error::拿不到 tag（TAG_REF=$TAG_REF）。手动触发请传 tag 输入，例如 -f tag=v0.2.0"
            exit 1
          fi
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG_REF 与 VERSION($VER) 不一致，先改 VERSION 再打 tag"
            exit 1
          fi

      - name: 打包原型（当前可交付物）
        run: |
          cd prototype
          zip -r "../dyapp-prototype-${TAG_REF}.zip" . -x '*.DS_Store' '*/__MACOSX/*'
          ls -lh "../dyapp-prototype-${TAG_REF}.zip"

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${TAG_REF}"
          ZIP="dyapp-prototype-${TAG}.zip"
          NOTES="release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 更新说明与附件"
            # --draft=false 很关键：**删掉 tag 会把已发布的 Release 变成草稿**，
            # 草稿对外不可见（匿名 API 查不到、releases/latest 也不指向它），
            # 而"只是 edit 一下"并不会把它变回公开发布。这里显式发布一次。
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --draft=false --notes-file "$NOTES"
            else
              gh release edit "$TAG" --draft=false --generate-notes
            fi
            gh release upload "$TAG" "$ZIP" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --generate-notes
          fi
          if [ -f "$NOTES" ]; then echo "更新说明来自 $NOTES"; else echo "::notice::没有 release-notes/${TAG}.md，本次用自动生成的说明"; fi
          # 收尾自查：确认它对外是"已发布、非草稿"，免得又是"流程全绿但 Release 看不见"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url

  # 安卓 APK 一并挂到 Release 附件（客户端「检查更新」打开的就是这个 Release）。
  #
  # 两点说明：
  #   1. `continue-on-error: true` —— 附件构建失败**不阻塞发版**：Release 与说明先生效，
  #      APK 之后重推 tag 或跑一次 build-artifacts 都能再补。
  #   2. CI **不持有签名材料**（keystore 不入库，这是硬约束），所以产物是**未签名**的：
  #      装之前请按 docs/03-应用架构与实现.md 第 7.3 节用 zipalign + apksigner 签一次。
  apk:
    needs: release
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      TAG_REF: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不装 android-actions/setup-android：它在 v3 实测直接失败（job 报 failure、后续步骤全 skipped）。
      # 镜像自带的 Android SDK 在 /usr/local/lib/android/sdk，但 cmdline-tools 未必在 PATH 上，
      # 所以这里自己把它接上（找不到就明确报错，别留下"跑过了但什么也没做"的假象）。
      - name: 接上 Android SDK 并安装 NDK
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ] && [ -d /usr/local/lib/android/sdk ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          if [ -z "${ANDROID_HOME:-}" ]; then echo "::error::找不到 Android SDK（ANDROID_HOME 未设置）"; exit 1; fi
          for d in "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/cmdline-tools/bin" "$ANDROID_HOME/tools/bin"; do
            [ -d "$d" ] && export PATH="$d:$PATH"
          done
          command -v sdkmanager >/dev/null || { echo "::error::sdkmanager 仍不可用，检查镜像的 cmdline-tools 布局"; ls -R "$ANDROID_HOME" | head -40; exit 1; }
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973" > /dev/null
          test -d "$ANDROID_HOME/ndk/27.0.12077973" || { echo "::error::NDK 没装到位"; exit 1; }
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973"
          } >> "$GITHUB_ENV"

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 APK（全部 ABI 的通用包）
        working-directory: app/src-tauri
        run: cargo tauri android build --apk

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)"
          if [ -z "$APK" ]; then echo "::error::没找到未签名 APK 产物"; exit 1; fi
          OUT="dyapp-${TAG_REF#v}-universal-unsigned.apk"
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          gh release upload "$TAG_REF" "$OUT" --clobber
          echo "::notice::APK 未签名，安装前请自行签名（docs/03 第 7.3 节）"
