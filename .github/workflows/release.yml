name: release

# 打 tag 即发版：tag 形如 v0.2.0，且必须与 VERSION 文件一致。
# 客户端「检查更新」读取的就是这里的 Release（tag = 版本号，body = 更新说明）。
#
# 更新说明优先取 `release-notes/<tag>.md`（由人写、进仓库留档），没有该文件才退回自动生成。
# **再次推送同一个 tag 是安全的**：Release 已存在时改为"更新说明 + 覆盖附件"，
# 这样修一版说明不必删 Release，也不会把工作流刷红。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 VERSION 一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG  VERSION=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 VERSION($VER) 不一致，先改 VERSION 再打 tag"
            exit 1
          fi

      - name: 打包原型（当前可交付物）
        run: |
          cd prototype
          zip -r "../dyapp-prototype-${GITHUB_REF_NAME}.zip" . -x '*.DS_Store' '*/__MACOSX/*'
          ls -lh "../dyapp-prototype-${GITHUB_REF_NAME}.zip"

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          ZIP="dyapp-prototype-${TAG}.zip"
          NOTES="release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 更新说明与附件"
            if [ -f "$NOTES" ]; then gh release edit "$TAG" --notes-file "$NOTES"; else gh release edit "$TAG" --generate-notes; fi
            gh release upload "$TAG" "$ZIP" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --generate-notes
          fi
          if [ -f "$NOTES" ]; then echo "更新说明来自 $NOTES"; else echo "::notice::没有 release-notes/${TAG}.md，本次用自动生成的说明"; fi

  # 安卓 APK 一并挂到 Release 附件（客户端「检查更新」打开的就是这个 Release）。
  #
  # 两点说明：
  #   1. `continue-on-error: true` —— 附件构建失败**不阻塞发版**：Release 与说明先生效，
  #      APK 之后重推 tag 或跑一次 build-artifacts 都能再补。
  #   2. CI **不持有签名材料**（keystore 不入库，这是硬约束），所以产物是**未签名**的：
  #      装之前请按 docs/03-应用架构与实现.md 第 7.3 节用 zipalign + apksigner 签一次。
  apk:
    needs: release
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不装 android-actions/setup-android：ubuntu-latest 镜像**自带** Android SDK 与 cmdline-tools，
      # sdkmanager 已在 PATH 上。实测那个 action 在 v3 会失败（job 报 failure、后续步骤全 skipped），
      # 而它装的东西镜像里本来就有——少一个外部依赖，少一处坏点。
      - name: 安装 Android NDK
        run: |
          command -v sdkmanager >/dev/null || { echo "::error::镜像里没有 sdkmanager（Android SDK 未预装？）"; exit 1; }
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 APK（全部 ABI 的通用包）
        working-directory: app/src-tauri
        run: cargo tauri android build --apk

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)"
          if [ -z "$APK" ]; then echo "::error::没找到未签名 APK 产物"; exit 1; fi
          OUT="dyapp-${GITHUB_REF_NAME#v}-universal-unsigned.apk"
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          gh release upload "${GITHUB_REF_NAME}" "$OUT" --clobber
          echo "::notice::APK 未签名，安装前请自行签名（docs/03 第 7.3 节）"
