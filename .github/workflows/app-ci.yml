name: app-ci

# 只在本项目 Rust 壳或前端界面变更时跑，避免每次文档改动都触发重型构建。
on:
  push:
    paths:
      - 'app/**'
      - 'prototype/**'
      - '.github/workflows/app-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'prototype/**'
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Tauri 2 在 Linux 上编译所需的系统库（官方清单）
      - name: Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 格式检查
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check

      - name: 编译检查
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

      # 密钥加密、存档读写等纯逻辑单测（不联网、不依赖 GUI）
      - name: Rust 单元测试
        run: cargo test --lib --manifest-path app/src-tauri/Cargo.toml

      - name: Clippy（不阻断，仅提示）
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 用真正的 ESM 解析：node --check 对 .js 里的 ES 模块会漏报（踩过）
      - name: 界面与内核语法检查（真实 ESM 解析）
        run: node --experimental-vm-modules tools/check-syntax.mjs

      - name: 内核单元测试
        run: node --test

      - name: 界面不得引用外部 CDN
        run: |
          if grep -rInE 'https?://[^"'"'"' )]*\.(js|css|woff2?|ttf)' prototype/ ; then
            echo "::error::界面引用了外部 CDN 资源，违反离线约束"
            exit 1
          fi
          echo "OK：无外部样式/脚本/字体引用"

      - name: 前端 ↔ 壳 的 command 名称必须两端一致
        run: |
          # bridge.js 里命令名有两种写法：call('xxx') 与 invoke('xxx')，两者都要收。
          # tr -d '\r' 是为了在 Windows 工作区（工具输出可能带 CR）也能比对。
          grep -oE "(call|invoke)\('[a-z_]+'" prototype/bridge.js \
            | sed -E "s/.*\('//; s/'$//" | tr -d '\r' | sort -u > /tmp/web_cmds.txt
          sed -n '/generate_handler!\[/,/\]/p' app/src-tauri/src/lib.rs \
            | grep -oE "\b(llm|sync|save|preset)_[a-z_]+" | tr -d '\r' | sort -u > /tmp/rust_cmds.txt
          echo "--- 前端调用 ---"; cat /tmp/web_cmds.txt
          echo "--- Rust 注册 ---"; cat /tmp/rust_cmds.txt
          missing="$(comm -23 /tmp/web_cmds.txt /tmp/rust_cmds.txt)"
          if [ -n "$missing" ]; then
            echo "::error::前端调用了 Rust 未注册的 command：$missing"
            exit 1
          fi
          echo "OK：前端调用的 command 都已在 Rust 侧注册"
