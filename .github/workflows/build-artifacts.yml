name: build-artifacts

# 产物构建（手动触发）：Windows 安装包（msi/nsis）+ 安卓 APK。
#
# 与 app-ci 的分工：app-ci 只做"检查"（fmt/check/test/语法/一致性），
# 这里只负责出可交付物（构建慢，按需跑，不阻塞日常提交）。
# 产物构建好后从 Actions 页面下载；发版时可手动挂到 Release 附件。
#
# 注意：本工作流按 Tauri 2 官方 CI 步骤编写，首次运行请在 Actions 页观察一次。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 Windows 安装包（msi + nsis）
        working-directory: app/src-tauri
        run: cargo tauri build

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 APK（全部 ABI 的通用包）
        working-directory: app/src-tauri
        run: cargo tauri android build --apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
