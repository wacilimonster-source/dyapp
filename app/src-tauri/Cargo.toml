[package]
name = "dyapp"
version = "0.3.0"
description = "道渊 · 独立版（安卓手机/平板 + Windows）"
authors = ["玖神"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2 移动端要求：静态库 + 动态库 + rlib 三件套
name = "dyapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "gzip",
] }
futures-util = "0.3"
bytes = "1"
urlencoding = "2"

# 本地密钥加密（防明文落盘 / 防随手导出）
chacha20poly1305 = "0.10"
hkdf = "0.12"
getrandom = "0.2"

# Windows 上用 DPAPI 保护密钥材料（绑定当前用户登录凭据）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }

# tokio 只被 #[tokio::test] 用到（库代码本身不直接依赖它），
# 放到 dev-dependencies 就不会进产物的依赖图
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
# 由 tauri-build 生成的移动端开关
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
