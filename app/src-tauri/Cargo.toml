[package]
name = "dyapp"
version = "0.1.0"
description = "道渊 · 独立版（安卓手机/平板 + Windows）"
authors = ["玖神"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2 移动端要求：静态库 + 动态库 + rlib 三件套
name = "dyapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "gzip",
] }
futures-util = "0.3"
bytes = "1"
urlencoding = "2"

[features]
# 由 tauri-build 生成的移动端开关
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
